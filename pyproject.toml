[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "go-explore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "daytona>=0.194.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["go_explore"]

[tool.go-explore.external-tools.harbor]
# Harbor is a system-wide CLI requirement, usually installed with `uv tool`.
version = "0.19.0"
extras = ["daytona", "huggingface"]
install = "uv tool install 'harbor[daytona,huggingface]==0.19.0' --force"

[project.scripts]
go-explore = "go_explore.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "e2e: tests that invoke Harbor, Docker, Daytona, or model APIs",
]
